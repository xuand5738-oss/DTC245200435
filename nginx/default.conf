log_format booking_json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log booking_json;
    error_log /var/log/nginx/error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    client_max_body_size 16k;
    location = /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
